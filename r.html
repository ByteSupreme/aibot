<!DOCTYPE html>
<html>
<head>
  <title>Telegram Mini App</title>
  <meta charset="utf-8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h2>Welcome to the Mini App</h2>
  <p><strong>User ID:</strong> <span id="uid">Loading...</span></p>
  <p><strong>Bot Username:</strong> <span id="bot-uname">Loading...</span></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const user = tg.initDataUnsafe.user;
    const bot = tg.initDataUnsafe.bot;

    document.getElementById("uid").innerText = user?.id || "Unknown";
    document.getElementById("bot-uname").innerText = bot?.username ? `@${bot.username}` : "Unknown bot";
  </script>
</body>
</html>
